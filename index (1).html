<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LIFE — Возвращаю своё</title>
<meta name="theme-color" content="#0A0A0C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   LIFE GAME 1.0 — DESIGN SYSTEM
   70% premium Apple-like / 30% RPG HUD
   ============================================================ */
:root{
  --void:#0A0A0C;
  --surface:#131316;
  --elevated:#1B1B1F;
  --elevated-2:#222227;
  --elevated-3:#2A2A30;
  --border:#28282E;
  --border-soft:#1D1D22;
  --text-hi:#F3F2EF;
  --text-mid:#A6A5AC;
  --text-low:#6E6D74;

  --accent:#FF6A2C;
  --accent-strong:#FF8A52;
  --accent-soft:rgba(255,106,44,.14);
  --accent-soft-2:rgba(255,106,44,.28);

  --success:#3ECF8E;
  --danger:#E5484D;
  --info:#4FA0E8;

  --rarity-common:#8B8B92;
  --rarity-rare:#4FA0E8;
  --rarity-epic:#B073E8;
  --rarity-legendary:#E8B23D;
  --rarity-mythic:#FF6A2C;

  --r-sm:10px;
  --r-md:14px;
  --r-lg:20px;
  --r-xl:26px;

  --font-ui:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --font-display:'Manrope',-apple-system,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,monospace;

  --sidebar-w:252px;
  --shadow-soft: 0 1px 0 rgba(255,255,255,.02) inset, 0 8px 24px rgba(0,0,0,.35);
}

*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:
    radial-gradient(1200px 700px at 85% -10%, rgba(255,106,44,.07), transparent 60%),
    radial-gradient(900px 600px at -10% 110%, rgba(80,90,255,.05), transparent 55%),
    var(--void);
  color:var(--text-hi);
  font-family:var(--font-ui);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
h1,h2,h3,h4{font-family:var(--font-display); margin:0; letter-spacing:-0.01em;}
p{margin:0;}
button{font-family:inherit;}
::selection{background:var(--accent-soft-2);}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--elevated-3);border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}
a{color:inherit;}
:focus-visible{outline:2px solid var(--accent-strong); outline-offset:2px; border-radius:6px;}

/* ---------- Layout ---------- */
#app{display:flex; min-height:100vh;}

#sidebar{
  width:var(--sidebar-w);
  flex-shrink:0;
  background:linear-gradient(180deg, rgba(255,255,255,.015), transparent 12%), var(--surface);
  border-right:1px solid var(--border-soft);
  display:flex; flex-direction:column;
  padding:20px 14px;
  position:sticky; top:0; height:100vh;
}
.brand{
  display:flex; align-items:center; gap:10px;
  padding:8px 10px 22px 10px;
}
.brand-mark{
  width:34px;height:34px;border-radius:10px;
  background:linear-gradient(145deg, var(--accent), #B8390E);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display); font-weight:800; font-size:15px; color:#0A0A0C;
  box-shadow:0 4px 14px rgba(255,106,44,.35);
}
.brand-text{display:flex;flex-direction:column;line-height:1.15;}
.brand-text b{font-size:14.5px; font-weight:800; letter-spacing:.01em;}
.brand-text span{font-size:11px; color:var(--text-low); font-weight:600;}

.navlist{display:flex; flex-direction:column; gap:2px; flex:1; overflow-y:auto;}
.navlink{
  display:flex; align-items:center; gap:11px;
  padding:9px 12px; border-radius:var(--r-sm);
  color:var(--text-mid); text-decoration:none; cursor:pointer;
  font-size:13.6px; font-weight:600;
  border:1px solid transparent;
  transition:background .15s ease, color .15s ease;
  background:none;
}
.navlink svg{width:18px;height:18px; flex-shrink:0; opacity:.85;}
.navlink:hover{background:var(--elevated); color:var(--text-hi);}
.navlink.active{
  background:var(--accent-soft); color:var(--accent-strong);
  border-color:rgba(255,106,44,.22);
}
.navlink.active svg{opacity:1;}
.nav-sep{height:1px;background:var(--border-soft); margin:10px 4px;}

.sidebar-foot{
  padding-top:12px; border-top:1px solid var(--border-soft);
  display:flex; align-items:center; gap:10px; margin-top:8px;
}
.mini-avatar{
  width:36px;height:36px;border-radius:50%;
  background:conic-gradient(var(--accent) calc(var(--xppct,40)*1%), var(--elevated-3) 0);
  display:flex;align-items:center;justify-content:center; flex-shrink:0;
  padding:2px;
}
.mini-avatar-inner{
  width:100%;height:100%;border-radius:50%;background:var(--elevated-2);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-mono); font-weight:700; font-size:12px;
}
.sidebar-foot .who{display:flex;flex-direction:column; overflow:hidden;}
.sidebar-foot .who b{font-size:12.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.sidebar-foot .who span{font-size:11px; color:var(--text-low); font-family:var(--font-mono);}

#mainCol{flex:1; display:flex; flex-direction:column; min-width:0;}

/* ---------- Top HUD ---------- */
#hud{
  display:flex; align-items:center; justify-content:space-between; gap:16px;
  padding:16px 28px; border-bottom:1px solid var(--border-soft);
  position:sticky; top:0; z-index:20;
  background:rgba(10,10,12,.72); backdrop-filter:blur(14px) saturate(140%);
}
.hud-title{display:flex; flex-direction:column; gap:2px;}
.hud-title h1{font-size:19px; font-weight:800;}
.hud-title p{font-size:12.5px; color:var(--text-low); font-weight:500;}
.hud-stats{display:flex; align-items:center; gap:10px;}
.hud-chip{
  display:flex; align-items:center; gap:7px;
  background:var(--elevated); border:1px solid var(--border-soft);
  padding:7px 12px; border-radius:999px; font-size:12.5px; font-weight:700;
  font-family:var(--font-mono);
}
.hud-chip svg{width:14px;height:14px;}
.hud-chip.lvl{color:var(--accent-strong); border-color:rgba(255,106,44,.25); background:var(--accent-soft);}
.hud-chip.gold{color:var(--rarity-legendary);}
.hud-chip.streak{color:#FF8A52;}
.hud-xpbar{width:120px; height:6px; border-radius:6px; background:var(--elevated-3); overflow:hidden; margin-left:2px;}
.hud-xpbar i{display:block; height:100%; background:linear-gradient(90deg, var(--accent), var(--accent-strong)); border-radius:6px; transition:width .5s ease;}
.icon-btn{
  width:36px;height:36px;border-radius:10px; border:1px solid var(--border-soft); background:var(--elevated);
  display:flex;align-items:center;justify-content:center; cursor:pointer; color:var(--text-mid);
}
.icon-btn:hover{color:var(--text-hi); border-color:var(--elevated-3);}
.icon-btn svg{width:17px;height:17px;}

#content{flex:1; padding:26px 28px 100px 28px; max-width:1180px; width:100%; margin:0 auto;}

/* ---------- Bottom nav (mobile) ---------- */
#bottomNav{
  display:none; position:fixed; bottom:0; left:0; right:0; z-index:40;
  background:rgba(19,19,22,.92); backdrop-filter:blur(16px);
  border-top:1px solid var(--border-soft);
  padding:6px 6px calc(6px + env(safe-area-inset-bottom)) 6px;
  justify-content:space-around; align-items:center;
}
.bn-item{
  display:flex; flex-direction:column; align-items:center; gap:3px;
  color:var(--text-low); font-size:10px; font-weight:600; cursor:pointer;
  padding:6px 8px; border-radius:10px; flex:1;
}
.bn-item svg{width:20px;height:20px;}
.bn-item.active{color:var(--accent-strong);}

/* ---------- Generic UI ---------- */
.section-head{display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:18px; gap:12px; flex-wrap:wrap;}
.section-head h2{font-size:22px; font-weight:800;}
.section-head p{font-size:13px; color:var(--text-low); margin-top:3px;}
.btn{
  display:inline-flex; align-items:center; gap:7px; cursor:pointer;
  padding:9px 16px; border-radius:var(--r-sm); font-size:13px; font-weight:700;
  border:1px solid var(--border-soft); background:var(--elevated); color:var(--text-hi);
  transition:transform .1s ease, background .15s ease;
  white-space:nowrap;
}
.btn:hover{background:var(--elevated-2);}
.btn:active{transform:scale(.97);}
.btn.primary{background:linear-gradient(155deg, var(--accent), #E0561D); border-color:transparent; color:#140700; box-shadow:0 6px 18px rgba(255,106,44,.28);}
.btn.primary:hover{filter:brightness(1.06);}
.btn.ghost{background:transparent;}
.btn.danger{color:var(--danger); border-color:rgba(229,72,77,.3); background:rgba(229,72,77,.08);}
.btn.sm{padding:6px 11px; font-size:12px;}
.btn svg{width:15px;height:15px;}

.card{
  background:linear-gradient(180deg, rgba(255,255,255,.017), transparent 20%), var(--surface);
  border:1px solid var(--border-soft); border-radius:var(--r-lg);
  padding:18px; box-shadow:var(--shadow-soft);
}
.grid{display:grid; gap:14px;}
.grid.cols-2{grid-template-columns:repeat(2,1fr);}
.grid.cols-3{grid-template-columns:repeat(3,1fr);}
.grid.cols-4{grid-template-columns:repeat(4,1fr);}
.grid.autofill{grid-template-columns:repeat(auto-fill,minmax(230px,1fr));}

.progress{height:8px;border-radius:6px;background:var(--elevated-3);overflow:hidden;}
.progress i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent),var(--accent-strong));}

.badge{display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:999px; font-size:11px; font-weight:700; letter-spacing:.01em;}
.badge.common{color:var(--rarity-common); background:rgba(139,139,146,.14);}
.badge.rare{color:var(--rarity-rare); background:rgba(79,160,232,.14);}
.badge.epic{color:var(--rarity-epic); background:rgba(176,115,232,.14);}
.badge.legendary{color:var(--rarity-legendary); background:rgba(232,178,61,.14);}
.badge.mythic{color:var(--accent-strong); background:var(--accent-soft);}

.empty{
  border:1px dashed var(--border); border-radius:var(--r-lg); padding:34px 20px;
  text-align:center; color:var(--text-low); font-size:13px;
}
.empty b{display:block; color:var(--text-mid); font-size:14px; margin-bottom:5px; font-weight:700;}

.field{display:flex; flex-direction:column; gap:6px; margin-bottom:12px;}
.field label{font-size:12px; font-weight:700; color:var(--text-mid);}
.field input, .field select, .field textarea{
  background:var(--elevated); border:1px solid var(--border-soft); color:var(--text-hi);
  padding:9px 11px; border-radius:var(--r-sm); font-size:13.5px; font-family:inherit;
}
.field input:focus, .field select:focus, .field textarea:focus{border-color:var(--accent-soft-2);}
.field-row{display:flex; gap:10px;}
.field-row .field{flex:1;}

/* ---------- Modal ---------- */
.modal-overlay{
  position:fixed; inset:0; background:rgba(6,6,7,.62); backdrop-filter:blur(4px);
  display:flex; align-items:center; justify-content:center; z-index:100; padding:16px;
  animation:fadeIn .15s ease;
}
@keyframes fadeIn{from{opacity:0} to{opacity:1}}
.modal{
  width:100%; max-width:440px; max-height:88vh; overflow-y:auto;
  background:var(--elevated); border:1px solid var(--border); border-radius:var(--r-lg);
  padding:22px; box-shadow:0 20px 60px rgba(0,0,0,.5);
}
.modal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
.modal-head h3{font-size:16.5px; font-weight:800;}
.modal-foot{display:flex; justify-content:flex-end; gap:10px; margin-top:6px;}

/* ---------- Toast ---------- */
#toastRoot{position:fixed; top:18px; left:50%; transform:translateX(-50%); z-index:200; display:flex; flex-direction:column; gap:8px; align-items:center;}
.toast{
  background:var(--elevated-2); border:1px solid var(--border); border-radius:999px;
  padding:10px 18px; font-size:13px; font-weight:700; display:flex; align-items:center; gap:8px;
  box-shadow:0 10px 30px rgba(0,0,0,.4);
  animation:toastIn .25s cubic-bezier(.2,.9,.3,1.2);
}
@keyframes toastIn{from{opacity:0; transform:translateY(-10px) scale(.95)} to{opacity:1; transform:translateY(0) scale(1)}}
.toast.xp{color:var(--accent-strong);}
.toast.gold{color:var(--rarity-legendary);}
.toast.unlock{color:var(--rarity-epic);}

/* ================= TODAY ================= */
.hero-quote{
  border:1px solid var(--border-soft); border-radius:var(--r-xl);
  padding:26px 26px; margin-bottom:20px; position:relative; overflow:hidden;
  background:linear-gradient(135deg, rgba(255,106,44,.10), rgba(255,106,44,.015) 60%), var(--surface);
}
.hero-quote:before{
  content:""; position:absolute; right:-60px; top:-60px; width:220px; height:220px; border-radius:50%;
  background:radial-gradient(circle, rgba(255,106,44,.20), transparent 70%);
}
.hero-quote .eyebrow{font-size:11.5px; font-weight:700; color:var(--accent-strong); text-transform:uppercase; letter-spacing:.08em; margin-bottom:10px;}
.hero-quote h2{font-size:23px; line-height:1.35; font-weight:700; max-width:640px; position:relative;}
.hero-quote .date{margin-top:12px; font-size:12px; color:var(--text-low); font-family:var(--font-mono);}

.today-cols{display:grid; grid-template-columns:1.4fr 1fr; gap:16px; align-items:start;}
.mini-stat-row{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:18px;}
.mini-stat{padding:15px; border-radius:var(--r-md); border:1px solid var(--border-soft); background:var(--surface);}
.mini-stat .num{font-family:var(--font-mono); font-size:21px; font-weight:700; color:var(--text-hi);}
.mini-stat .lbl{font-size:11.5px; color:var(--text-low); margin-top:3px; font-weight:600;}

.quest-row{
  display:flex; align-items:center; gap:13px; padding:13px 14px; border-radius:var(--r-md);
  border:1px solid var(--border-soft); background:var(--surface); margin-bottom:9px;
  transition:border-color .15s ease;
}
.quest-row:hover{border-color:var(--elevated-3);}
.quest-row.done{opacity:.5;}
.quest-check{
  width:26px;height:26px;border-radius:50%; border:2px solid var(--elevated-3); flex-shrink:0; cursor:pointer;
  display:flex;align-items:center;justify-content:center; transition:all .15s ease; background:var(--elevated);
}
.quest-check.on{background:var(--accent); border-color:var(--accent);}
.quest-check svg{width:13px;height:13px; color:#140700; opacity:0;}
.quest-check.on svg{opacity:1;}
.quest-icon{
  width:36px;height:36px;border-radius:10px; display:flex;align-items:center;justify-content:center; flex-shrink:0;
  background:var(--elevated-2); color:var(--accent-strong);
}
.quest-icon svg{width:17px;height:17px;}
.quest-body{flex:1; min-width:0;}
.quest-body .t{font-size:13.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.quest-body .m{font-size:11.5px; color:var(--text-low); margin-top:2px; font-family:var(--font-mono);}
.quest-actions{display:flex; gap:6px; opacity:0; transition:opacity .12s ease;}
.quest-row:hover .quest-actions{opacity:1;}
.icon-mini{width:28px;height:28px;border-radius:8px; display:flex;align-items:center;justify-content:center; cursor:pointer; color:var(--text-low); background:var(--elevated);}
.icon-mini:hover{color:var(--text-hi);}
.icon-mini svg{width:14px;height:14px;}

.tab-row{display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap;}
.tab-btn{padding:7px 14px; border-radius:999px; font-size:12.5px; font-weight:700; cursor:pointer; border:1px solid var(--border-soft); background:var(--surface); color:var(--text-mid);}
.tab-btn.active{background:var(--accent-soft); color:var(--accent-strong); border-color:rgba(255,106,44,.25);}

/* ================= PROJECTS ================= */
.project-card{border-radius:var(--r-lg); border:1px solid var(--border-soft); background:var(--surface); padding:20px; position:relative; overflow:hidden;}
.project-card .bar-accent{position:absolute; left:0; top:0; bottom:0; width:3px;}
.project-card h3{font-size:16px; font-weight:800; margin-bottom:4px;}
.project-card .stage{font-size:12px; color:var(--text-low); font-weight:600; margin-bottom:14px;}
.project-card .obj{font-size:12.5px; margin-bottom:6px; display:flex; gap:6px;}
.project-card .obj b{color:var(--text-mid); font-weight:700; flex-shrink:0;}
.project-card .pct{font-family:var(--font-mono); font-weight:700; font-size:12px; color:var(--text-mid);}
.project-card .progress{margin-top:10px; margin-bottom:4px;}
.project-foot{display:flex; justify-content:space-between; align-items:center; margin-top:14px;}

/* ================= WISHES ================= */
.wish-card{
  border-radius:var(--r-lg); border:1px solid var(--border-soft); background:var(--surface); overflow:hidden;
  display:flex; flex-direction:column;
}
.wish-visual{
  height:110px; display:flex; align-items:center; justify-content:center; position:relative;
  font-family:var(--font-display); font-weight:800; font-size:34px; color:rgba(255,255,255,.9);
}
.wish-visual .glow{position:absolute; inset:0; opacity:.22;}
.wish-body{padding:14px 15px 16px 15px;}
.wish-body h4{font-size:14.5px; font-weight:800; margin-bottom:6px;}
.wish-price{font-size:12px; color:var(--text-low); font-family:var(--font-mono); margin-bottom:10px;}
.wish-progress-row{display:flex; align-items:center; gap:8px; margin-top:8px;}
.wish-progress-row .progress{flex:1;}
.wish-progress-row span{font-family:var(--font-mono); font-size:11.5px; color:var(--text-mid); width:32px; text-align:right;}
.wish-actions{display:flex; gap:6px; margin-top:12px;}

/* ================= INVENTORY ================= */
.inv-item{border-radius:var(--r-md); border:1px solid var(--border-soft); background:var(--surface); padding:14px; text-align:center;}
.inv-icon{width:46px;height:46px;border-radius:12px; margin:0 auto 9px auto; display:flex;align-items:center;justify-content:center; font-weight:800; font-family:var(--font-display); font-size:16px;}
.inv-item .n{font-size:12px; font-weight:700;}
.inv-item .s{font-size:10.5px; color:var(--text-low); margin-top:2px;}

/* ================= ROUTINE ================= */
.routine-block{margin-bottom:22px;}
.routine-block h3{font-size:14px; font-weight:800; margin-bottom:10px; color:var(--text-mid); display:flex; align-items:center; gap:8px;}
.routine-report{display:flex; gap:14px; margin-bottom:22px;}
.report-ring{width:64px;height:64px; border-radius:50%; display:flex;align-items:center;justify-content:center; flex-shrink:0;}
.report-ring b{font-family:var(--font-mono); font-size:15px;}

/* ================= MONEY ================= */
.money-summary{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:20px;}
.money-summary .card{padding:16px;}
.money-summary .lbl{font-size:12px; color:var(--text-low); font-weight:700;}
.money-summary .val{font-family:var(--font-mono); font-size:21px; font-weight:700; margin-top:6px;}
.ledger-row{display:flex; align-items:center; justify-content:space-between; padding:10px 4px; border-bottom:1px solid var(--border-soft); font-size:13px;}
.ledger-row:last-child{border-bottom:none;}
.ledger-row .cat{color:var(--text-low); font-size:11.5px;}
.ledger-row .amt{font-family:var(--font-mono); font-weight:700;}
.ledger-row .amt.pos{color:var(--success);}
.ledger-row .amt.neg{color:var(--danger);}
.cat-bar-row{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
.cat-bar-row .lbl{width:110px; font-size:12px; color:var(--text-mid); flex-shrink:0;}
.cat-bar-row .progress{flex:1;}
.cat-bar-row .v{width:70px; text-align:right; font-family:var(--font-mono); font-size:11.5px; color:var(--text-mid);}

/* ================= STATS ================= */
.spark-wrap{padding:6px 0 0 0;}
.bars-week{display:flex; align-items:flex-end; gap:10px; height:120px; margin-top:10px;}
.bars-week .bcol{flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; justify-content:flex-end; height:100%;}
.bars-week .b{width:100%; border-radius:6px 6px 3px 3px; background:linear-gradient(180deg, var(--accent-strong), var(--accent)); min-height:4px;}
.bars-week .lb{font-size:10.5px; color:var(--text-low); font-weight:600;}
.attr-bar-row{display:flex; align-items:center; gap:10px; margin-bottom:12px;}
.attr-bar-row .ic{width:30px;height:30px;border-radius:9px;background:var(--elevated-2);display:flex;align-items:center;justify-content:center;color:var(--accent-strong); flex-shrink:0;}
.attr-bar-row .ic svg{width:15px;height:15px;}
.attr-bar-row .info{flex:1;}
.attr-bar-row .info .top{display:flex; justify-content:space-between; font-size:12.5px; font-weight:700; margin-bottom:5px;}
.attr-bar-row .info .top span{font-family:var(--font-mono); color:var(--text-mid); font-weight:600;}

/* ================= MAP (journey road) ================= */
.journey{position:relative; padding:10px 0;}
.j-node{display:flex; gap:16px; position:relative; padding-bottom:30px;}
.j-node:last-child{padding-bottom:0;}
.j-node:before{content:""; position:absolute; left:15px; top:34px; bottom:-4px; width:2px; background:var(--border);}
.j-node:last-child:before{display:none;}
.j-dot{width:32px;height:32px;border-radius:50%; flex-shrink:0; display:flex;align-items:center;justify-content:center; z-index:1; border:2px solid var(--border);}
.j-dot.done{background:var(--success); border-color:var(--success); color:#04150c;}
.j-dot.current{background:var(--accent); border-color:var(--accent); color:#170800; box-shadow:0 0 0 5px var(--accent-soft);}
.j-dot.locked{background:var(--elevated); color:var(--text-low);}
.j-dot svg{width:15px;height:15px;}
.j-body{padding-top:4px;}
.j-body b{font-size:14px; font-weight:700;}
.j-body p{font-size:12px; color:var(--text-low); margin-top:3px;}

/* ================= CHARACTER ================= */
.char-hero{display:flex; align-items:center; gap:22px; padding:26px; margin-bottom:20px;}
.char-avatar{
  width:92px;height:92px;border-radius:50%; flex-shrink:0; padding:4px;
  background:conic-gradient(var(--accent) calc(var(--pct,0)*1%), var(--elevated-3) 0);
}
.char-avatar-inner{width:100%;height:100%;border-radius:50%; background:var(--elevated-2); display:flex;align-items:center;justify-content:center; font-family:var(--font-display); font-weight:800; font-size:26px;}
.char-info h2{font-size:22px; font-weight:800;}
.char-info .sub{font-size:12.5px; color:var(--text-low); margin-top:4px; font-family:var(--font-mono);}
.char-xp-bar{width:260px; margin-top:12px;}

/* ================= ACHIEVEMENTS ================= */
.ach-card{border-radius:var(--r-lg); border:1px solid var(--border-soft); background:var(--surface); padding:18px; display:flex; gap:14px; align-items:flex-start;}
.ach-card.locked{opacity:.42;}
.ach-icon{width:44px;height:44px;border-radius:12px; background:var(--elevated-2); display:flex;align-items:center;justify-content:center; color:var(--rarity-legendary); flex-shrink:0;}
.ach-icon svg{width:20px;height:20px;}
.ach-card h4{font-size:13.5px; font-weight:800; margin-bottom:4px;}
.ach-card p{font-size:12px; color:var(--text-low); line-height:1.4;}

/* ================= COURSES ================= */
.course-chain{display:flex; flex-wrap:wrap; gap:6px; align-items:center; font-size:11.5px; color:var(--text-low); margin-bottom:10px; font-weight:600;}
.course-chain b{color:var(--accent-strong);}
.chain-arrow{color:var(--text-low);}
.lesson-row{display:flex; align-items:center; gap:10px; padding:9px 4px; border-bottom:1px solid var(--border-soft); font-size:13px;}
.lesson-row:last-child{border-bottom:none;}
.lesson-row .t.done{text-decoration:line-through; color:var(--text-low);}

/* ================= SETTINGS ================= */
.settings-group{margin-bottom:26px;}
.settings-group h3{font-size:14px; font-weight:800; margin-bottom:12px;}
.danger-zone{border:1px solid rgba(229,72,77,.3); border-radius:var(--r-lg); padding:18px; background:rgba(229,72,77,.05);}

/* ================= RESPONSIVE ================= */
@media (max-width: 880px){
  #sidebar{display:none;}
  #bottomNav{display:flex;}
  #content{padding:18px 16px 90px 16px;}
  #hud{padding:14px 16px;}
  .hud-xpbar{display:none;}
  .today-cols{grid-template-columns:1fr;}
  .mini-stat-row{grid-template-columns:repeat(2,1fr);}
  .grid.cols-2,.grid.cols-3,.grid.cols-4{grid-template-columns:1fr 1fr;}
  .money-summary{grid-template-columns:1fr;}
  .char-hero{flex-direction:column; text-align:center;}
  .char-xp-bar{width:100%;}
  .field-row{flex-direction:column;}
}
@media (max-width: 480px){
  .grid.cols-2,.grid.cols-3,.grid.cols-4{grid-template-columns:1fr;}
  .hero-quote h2{font-size:19px;}
}

/* ---------------- STATE ---------------- */
let state = null;

function loadState(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){ state = JSON.parse(raw); }
    else { state = seedState(); }
  }catch(e){ state = seedState(); }
  ensureDailyRollover();
  saveState();
}
function saveState(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){ console.error("save failed", e); }
}
function resetState(){
  state = seedState();
  saveState();
  route();
}

function ensureDailyRollover(){
  const t = todayStr();
  if(state.meta.lastOpenDate && state.meta.lastOpenDate !== t){
    const y = todayStr(new Date(Date.now()-86400000));
    const activeYesterday = !!(state.log && state.log[y] && state.log[y].completed>0);
    if(!activeYesterday){ state.stats.activeDaysStreak = 0; }
  }
  state.meta.lastOpenDate = t;
}

/* ---------------- XP / LEVEL ENGINE ---------------- */
function xpToNext(level){ return state.settings.xpBase + (level-1)*state.settings.xpGrowth; }

function grantXP(amount, gold){
  const c = state.character;
  c.xp += amount;
  c.gold += (gold||0);
  let leveledUp = false;
  while(c.xp >= xpToNext(c.level)){
    c.xp -= xpToNext(c.level);
    c.level += 1;
    leveledUp = true;
  }
  logToday(amount, gold||0, 0);
  return leveledUp;
}
function grantAttr(attrKey, amount){
  if(!attrKey) return;
  state.character.attributes[attrKey] = (state.character.attributes[attrKey]||0) + amount;
}
function logToday(xp,gold,completedDelta){
  const t = todayStr();
  if(!state.log[t]) state.log[t] = {xp:0,gold:0,completed:0};
  state.log[t].xp += xp; state.log[t].gold += gold; state.log[t].completed += completedDelta;
}
function markActiveToday(){
  const t = todayStr();
  if(state.stats.lastActiveDate !== t){
    state.stats.activeDaysStreak = (state.stats.activeDaysStreak||0) + 1;
    state.stats.lastActiveDate = t;
  }
}

function checkAchievements(){
  const s = state;
  const unlockedNow = [];
  s.achievements.forEach(a=>{
    if(a.unlocked) return;
    let value;
    if(a.cond.k.indexOf("attr_")===0){ value = s.character.attributes[a.cond.k.slice(5)]||0; }
    else if(a.cond.k === "level"){ value = s.character.level; }
    else { value = s.stats[a.cond.k]||0; }
    if(value >= a.cond.v){ a.unlocked = true; a.unlockedAt = todayStr(); unlockedNow.push(a); }
  });
  return unlockedNow;
}

}

}

function convert(amount, from, to){
  const r = state.money.rates;
  const inEur = amount / (r[from]||1);
  return inEur * (r[to]||1);
}
function renderMoney(){
  const el = document.getElementById("content");
  const cur = state.money.currency;
  const totalIncome = state.money.income.reduce(function(s,x){return s+convert(x.amount,x.currency,cur);},0);
  const totalExpense = state.money.expenses.reduce(function(s,x){return s+convert(x.amount,x.currency,cur);},0);
  const balance = totalIncome - totalExpense;

  const catMap = {};
  state.money.expenses.forEach(function(x){ catMap[x.category]=(catMap[x.category]||0)+convert(x.amount,x.currency,cur); });
  const catVals = Object.keys(catMap).map(function(k){return catMap[k];});

    '<div class="section-head">'+

      '<div class="card"><div class="lbl">Расходы</div><div class="val" style="color:var(--danger)">-'+fmt(totalExpense)+' '+cur+'</div></div>'+
      '<div class="card"><div class="lbl">Баланс</div><div class="val">'+fmt(balance)+' '+cur+'</div></div>'+

/* ================================================================
   ACTIONS (exposed via window.LG)
   ================================================================ */
function go(id){ location.hash = "#"+id; }

function afterProgressChange(){
  const unlocked = checkAchievements();
  saveState();
  unlocked.forEach(function(a){ toast(I.achievements+" Достижение открыто: "+a.name, "unlock"); });
}

function toggleQuest(id){
  const q = state.quests.find(function(x){return x.id===id;}); if(!q) return;
  const t = todayStr();
  const wasDone = q.doneDates.indexOf(t)!==-1;
  if(wasDone){
    q.doneDates = q.doneDates.filter(function(d){return d!==t;});
    state.character.xp -= q.xp; state.character.gold -= q.gold;
    grantAttr(q.attr, -2);
    state.stats.totalQuestsCompleted = Math.max(0,(state.stats.totalQuestsCompleted||0)-1);
    if(q.category==="youtube") state.stats.totalVideoQuestsCompleted = Math.max(0,(state.stats.totalVideoQuestsCompleted||0)-1);
    logToday(-q.xp,-q.gold,-1);
  } else {
    q.doneDates.push(t);
    const leveledUp = grantXP(q.xp, q.gold);
    grantAttr(q.attr, 2);
    state.stats.totalQuestsCompleted = (state.stats.totalQuestsCompleted||0)+1;
    if(q.category==="youtube") state.stats.totalVideoQuestsCompleted = (state.stats.totalVideoQuestsCompleted||0)+1;
    logToday(0,0,1);
    markActiveToday();
    toast("MISSION COMPLETE &nbsp; +"+q.xp+" XP · +"+q.gold+" Gold", "xp");
    if(leveledUp) toast("НОВЫЙ УРОВЕНЬ: "+state.character.level, "unlock");
  }
  afterProgressChange();
  route();
}

function editQuest(id){
  const q = id ? state.quests.find(function(x){return x.id===id;}) : {id:null,title:"",category:"work",xp:20,gold:10,attr:"discipline",doneDates:[]};
  const cats = [["youtube","YouTube"],["body","Тело"],["learn","Обучение"],["work","Проект"],["personal","Личное"],["morning","Утро"]];
  const attrs = [["mind","Разум"],["body","Тело"],["discipline","Дисциплина"],["creativity","Креативность"],["money","Деньги"],["social","Социум"],["energy","Энергия"]];
  openModal(id?"Изменить квест":"Новый квест",
    '<div class="field"><label>Название</label><input id="f_title" value="'+q.title+'"></div>'+
    '<div class="field-row">'+
      '<div class="field"><label>Категория</label><select id="f_cat">'+cats.map(function(c){return '<option value="'+c[0]+'" '+(c[0]===q.category?'selected':'')+'>'+c[1]+'</option>';}).join("")+'</select></div>'+
      '<div class="field"><label>Атрибут</label><select id="f_attr">'+attrs.map(function(a){return '<option value="'+a[0]+'" '+(a[0]===q.attr?'selected':'')+'>'+a[1]+'</option>';}).join("")+'</select></div>'+
    '</div>'+
    '<div class="field-row">'+
      '<div class="field"><label>XP</label><input type="number" id="f_xp" value="'+q.xp+'"></div>'+
      '<div class="field"><label>Gold</label><input type="number" id="f_gold" value="'+q.gold+'"></div>'+
    '</div>',
    function(){
      const title = val("f_title").trim(); if(!title){ toast("Введите название"); return false; }
      if(id){
        q.title=title; q.category=val("f_cat"); q.attr=val("f_attr"); q.xp=+val("f_xp"); q.gold=+val("f_gold");
      } else {
        state.quests.push({id:uid("q"), title:title, category:val("f_cat"), icon:val("f_cat"), attr:val("f_attr"), xp:+val("f_xp"), gold:+val("f_gold"), recurring:true, doneDates:[]});
      }
      saveState(); route();
    },
    id?{extraBtn:'<button class="btn danger sm" onclick="LG.deleteQuest(\''+id+'\');LG.closeModal()">Удалить</button>'}:{}
  );
}
function deleteQuest(id){ state.quests = state.quests.filter(function(q){return q.id!==id;}); saveState(); route(); }

function editProject(id){
  const p = id ? state.projects.find(function(x){return x.id===id;}) : {name:"",stage:"",progress:0,current:"",next:"",color:"#FF6A2C"};
  openModal(id?"Изменить проект":"Новый проект",
    '<div class="field"><label>Название</label><input id="f_name" value="'+p.name+'"></div>'+
    '<div class="field"><label>Стадия</label><input id="f_stage" value="'+p.stage+'"></div>'+

    '<div class="field"><label>Следующая задача</label><input id="f_next" value="'+p.next+'"></div>'+
    '<div class="field-row">'+
      '<div class="field"><label>Прогресс %</label><input type="number" id="f_prog" value="'+p.progress+'" min="0" max="100"></div>'+
      '<div class="field"><label>Цвет</label><input type="color" id="f_color" value="'+p.color+'"></div>'+

      else state.projects.push({id:uid("p"), name:name, stage:val("f_stage"), current:val("f_cur"), next:val("f_next"), progress:clamp(+val("f_prog"),0,100), color:val("f_color")});
      saveState(); route();

function deleteProject(id){ state.projects = state.projects.filter(function(p){return p.id!==id;}); saveState(); route(); }
function bumpProject(id, delta){
  const p = state.projects.find(function(x){return x.id===id;}); if(!p) return;
  p.progress = clamp(p.progress+delta,0,100); saveState(); route();
}

function editWish(id){
  const w = id ? state.wishes.find(function(x){return x.id===id;}) : {name:"",rarity:"common",price:"",progress:0,note:""};
  const rarities = ["common","rare","epic","legendary","mythic"];
  openModal(id?"Изменить желание":"Новое желание",
    '<div class="field"><label>Название</label><input id="f_name" value="'+w.name+'"></div>'+
    '<div class="field-row">'+
      '<div class="field"><label>Редкость</label><select id="f_rar">'+rarities.map(function(r){return '<option value="'+r+'" '+(r===w.rarity?'selected':'')+'>'+rarityLabel(r)+'</option>';}).join("")+'</select></div>'+
      '<div class="field"><label>Цена / условие</label><input id="f_price" value="'+w.price+'"></div>'+
    '</div>'+
    '<div class="field"><label>Прогресс %</label><input type="number" id="f_prog" value="'+w.progress+'" min="0" max="100"></div>'+
    '<div class="field"><label>Заметка</label><input id="f_note" value="'+(w.note||'')+'"></div>',
    function(){
      const name = val("f_name").trim(); if(!name){ toast("Введите название"); return false; }
      if(id){ w.name=name; w.rarity=val("f_rar"); w.price=val("f_price"); w.progress=clamp(+val("f_prog"),0,100); w.note=val("f_note"); }
      else state.wishes.push({id:uid("w"), name:name, rarity:val("f_rar"), price:val("f_price"), progress:clamp(+val("f_prog"),0,100), note:val("f_note")});
      saveState(); route();
    },
    id?{extraBtn:'<button class="btn danger sm" onclick="LG.deleteWish(\''+id+'\');LG.closeModal()">Удалить</button>'}:{}
  );
}
function deleteWish(id){ state.wishes = state.wishes.filter(function(w){return w.id!==id;}); saveState(); route(); }
function bumpWish(id, delta){
  const w = state.wishes.find(function(x){return x.id===id;}); if(!w) return;
  const was100 = w.progress>=100;
  w.progress = clamp(w.progress+delta,0,100);
  if(w.progress>=100 && !was100){
    state.stats.wishesUnlocked = (state.stats.wishesUnlocked||0)+1;
    toast("Мечта разблокирована: "+w.name, "unlock");
  }
  afterProgressChange(); route();
}

function toggleRoutine(timeKey, id){
  const task = state.routine[timeKey].find(function(x){return x.id===id;}); if(!task) return;
  const t = todayStr();
  const was = task.doneDates.indexOf(t)!==-1;
  if(was){ task.doneDates = task.doneDates.filter(function(d){return d!==t;}); logToday(0,0,-1); }
  else { task.doneDates.push(t); logToday(0,0,1); markActiveToday(); }
  afterProgressChange(); route();
}
function addRoutine(timeKey){
  openModal("Новый пункт распорядка", '<div class="field"><label>Название</label><input id="f_title"></div>', function(){
    const title = val("f_title").trim(); if(!title) return false;
    state.routine[timeKey].push({id:uid("r"), title:title, doneDates:[]});
    saveState(); route();
  });
}
function deleteRoutine(timeKey,id){ state.routine[timeKey] = state.routine[timeKey].filter(function(x){return x.id!==id;}); saveState(); route(); }

function setCurrency(c){ state.money.currency=c; saveState(); route(); }
function addMoney(kind){
  const cur = state.money.currency;
  openModal(kind==="income"?"Новый доход":"Новый расход",
    '<div class="field-row">'+
      '<div class="field"><label>Сумма</label><input type="number" id="f_amt" value="0"></div>'+
      '<div class="field"><label>Валюта</label><select id="f_cur">'+Object.keys(state.money.rates).map(function(c){return '<option '+(c===cur?'selected':'')+'>'+c+'</option>';}).join("")+'</select></div>'+
    '</div>'+
    '<div class="field"><label>Категория</label><input id="f_cat" value="'+(kind==='income'?'Работа':'Прочее')+'"></div>',
    function(){
      const amt = +val("f_amt"); if(!amt){ toast("Укажите сумму"); return false; }
      const entry = {id:uid(kind), amount:amt, currency:val("f_cur"), category:val("f_cat"), date:todayStr(), note:""};
      if(kind==="income"){ state.money.income.push(entry); state.stats.totalIncome=(state.stats.totalIncome||0)+convert(amt,entry.currency,"EUR"); }
      else state.money.expenses.push(entry);
      afterProgressChange(); route();
    }
  );
}
function addSavingsGoal(){
  openModal("Новая цель накоплений",
    '<div class="field"><label>Название</label><input id="f_name"></div>'+
    '<div class="field-row"><div class="field"><label>Цель, €</label><input type="number" id="f_target" value="1000"></div><div class="field"><label>Уже накоплено, €</label><input type="number" id="f_current" value="0"></div></div>',
    function(){
      const name = val("f_name").trim(); if(!name) return false;
      state.money.savingsGoals.push({id:uid("sg"), name:name, target:+val("f_target"), current:+val("f_current")});
      saveState(); route();
    }
  );
}
function saveRates(){
  document.querySelectorAll(".rateInput").forEach(function(inp){ state.money.rates[inp.dataset.cur] = +inp.value || 1; });
  saveState(); toast("Курсы обновлены"); route();
}

function editWaypoint(id){
  const m = id ? state.map.find(function(x){return x.id===id;}) : {name:"",status:"locked",note:""};
  openModal(id?"Изменить точку":"Новая точка маршрута",
    '<div class="field"><label>Название</label><input id="f_name" value="'+m.name+'"></div>'+
    '<div class="field"><label>Статус</label><select id="f_status">'+
      '<option value="done" '+(m.status==='done'?'selected':'')+'>Пройдено</option>'+
      '<option value="current" '+(m.status==='current'?'selected':'')+'>Текущее</option>'+
      '<option value="locked" '+(m.status==='locked'?'selected':'')+'>Впереди</option>'+
    '</select></div>'+
    '<div class="field"><label>Заметка</label><input id="f_note" value="'+(m.note||'')+'"></div>',
    function(){
      const name = val("f_name").trim(); if(!name) return false;
      if(id){ m.name=name; m.status=val("f_status"); m.note=val("f_note"); }
      else state.map.push({id:uid("m"), name:name, status:val("f_status"), note:val("f_note")});
      saveState(); route();
    },
    id?{extraBtn:'<button class="btn danger sm" onclick="LG.deleteWaypoint(\''+id+'\');LG.closeModal()">Удалить</button>'}:{}
  );
}
function deleteWaypoint(id){ state.map = state.map.filter(function(m){return m.id!==id;}); saveState(); route(); }

function renameCharacter(){
  openModal("Имя персонажа", '<div class="field"><label>Имя</label><input id="f_name" value="'+state.character.name+'"></div>', function(){
    const name = val("f_name").trim(); if(!name) return false;
    state.character.name = name; saveState(); route();
  });
}

function toggleLesson(courseId, lessonId){
  const c = state.courses.find(function(x){return x.id===courseId;}); if(!c) return;
  const l = c.lessons.find(function(x){return x.id===lessonId;}); if(!l) return;
  l.done = !l.done;
  if(l.done) grantXP(c.xpPerLesson||10,0);
  else state.character.xp -= (c.xpPerLesson||10);
  afterProgressChange(); route();
}
function editCourse(id){
  const c = id ? state.courses.find(function(x){return x.id===id;}) : {goal:"",project:"",skill:"",course:"",lessons:[],xpPerLesson:15};
  openModal(id?"Изменить курс":"Новый курс",
    '<div class="field"><label>Цель</label><input id="f_goal" value="'+c.goal+'"></div>'+
    '<div class="field"><label>Проект</label><input id="f_project" value="'+c.project+'"></div>'+
    '<div class="field"><label>Недостающий навык</label><input id="f_skill" value="'+c.skill+'"></div>'+
    '<div class="field"><label>Название курса</label><input id="f_course" value="'+c.course+'"></div>'+
    '<div class="field"><label>XP за урок</label><input type="number" id="f_xp" value="'+c.xpPerLesson+'"></div>'+
    '<div class="field"><label>Уроки (по одному в строке)</label><textarea id="f_lessons" rows="4">'+c.lessons.map(function(l){return l.name;}).join("\n")+'</textarea></div>',
    function(){
      const goal = val("f_goal").trim(); if(!goal) return false;
      const lessonNames = val("f_lessons").split("\n").map(function(s){return s.trim();}).filter(Boolean);
      const lessons = lessonNames.map(function(n,i){
        const existing = c.lessons[i];
        return {id: existing?existing.id:uid("l"), name:n, done: existing?existing.done:false};
      });
      if(id){ c.goal=goal; c.project=val("f_project"); c.skill=val("f_skill"); c.course=val("f_course"); c.xpPerLesson=+val("f_xp"); c.lessons=lessons; }
      else state.courses.push({id:uid("c"), goal:goal, project:val("f_project"), skill:val("f_skill"), course:val("f_course"), xpPerLesson:+val("f_xp"), lessons:lessons});
      saveState(); route();
    },
    id?{extraBtn:'<button class="btn danger sm" onclick="LG.deleteCourse(\''+id+'\');LG.closeModal()">Удалить</button>'}:{}
  );
}
function deleteCourse(id){ state.courses = state.courses.filter(function(c){return c.id!==id;}); saveState(); route(); }

function saveXpFormula(){
  state.settings.xpBase = +val("setXpBase")||100;
  state.settings.xpGrowth = +val("setXpGrowth")||50;
  saveState(); toast("Формула обновлена"); route();
}

function exportJSON(){
  const blob = new Blob([JSON.stringify(state,null,2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "life-game-export-"+todayStr()+".json";
  a.click();
}
function importJSON(evt){
  const file = evt.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = function(){
    try{
      const parsed = JSON.parse(reader.result);
      state = parsed; saveState(); toast("Данные импортированы"); route();
    }catch(e){ toast("Ошибка чтения файла"); }
  };
  reader.readAsText(file);
}
function confirmReset(){
  openModal("Сбросить систему?", '<p style="font-size:13px;color:var(--text-mid);">Весь прогресс будет удалён и заменён исходными данными. Это действие нельзя отменить.</p>', function(){
    resetState(); toast("Система сброшена");
  }, {saveLabel:"Сбросить"});
}

/* expose */
window.LG = {
  go: go, closeModal: closeModal, toggleQuest: toggleQuest, editQuest: editQuest, deleteQuest: deleteQuest,
  editProject: editProject, deleteProject: deleteProject, bumpProject: bumpProject,
  editWish: editWish, deleteWish: deleteWish, bumpWish: bumpWish,
  toggleRoutine: toggleRoutine, addRoutine: addRoutine, deleteRoutine: deleteRoutine,
  setCurrency: setCurrency, addMoney: addMoney, addSavingsGoal: addSavingsGoal, saveRates: saveRates,
  editWaypoint: editWaypoint, deleteWaypoint: deleteWaypoint,
  renameCharacter: renameCharacter,
  toggleLesson: toggleLesson, editCourse: editCourse, deleteCourse: deleteCourse,
  saveXpFormula: saveXpFormula, exportJSON: exportJSON, importJSON: importJSON, confirmReset: confirmReset,
};

/* ---------------- INIT ---------------- */
loadState();
route();

})();
